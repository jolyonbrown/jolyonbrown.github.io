# uncomment this, then update params.mcpEndpoint in ../hugo.toml to match.
# routes = [{ pattern = "mcp.jolyonbrown.com", custom_domain = true }]

[vars]
SITE_DATA_URL = "https://jolyonbrown.com/site.json"
