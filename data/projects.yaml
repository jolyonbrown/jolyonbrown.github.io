# The workshop. Status is one of: idea, building, shipped, ongoing, abandoned.
# Abandoned projects are welcome - they make the list honest.

- name: Omega Rust
  status: shipped
  year: 2026
  summary: >-
    A vector-graphics homage to Midway's 1981 arcade game Omega Race, written in Rust. Everything
    on screen is line segments - even the stroke-font text - with a phosphor glow pipeline, and
    all the sound is synthesised in the style of the original's sound chips. Claude directed it
    as creative lead and Codex built it milestone by milestone. Playable in the browser.
  links:
    - title: Play on itch.io
      url: https://jolyonbrown.itch.io/omega-rust
    - title: Source
      url: https://github.com/jolyonbrown/omega_rust

- name: Blast-a-Pic
  status: shipped
  year: 2026
  summary: >-
    A calm bead-blasting puzzle for the iPad, with no ads, no lives and no timers. Each level is a
    picture made of ironing beads; turrets can only hit beads they can see from below, so you peel
    each picture from the bottom up. Nearly 60 levels across six sets, every one checked by a
    solver so it can always be beaten. Plain HTML, CSS and JavaScript, and it works offline.
  links:
    - title: Play it
      url: https://jolyonbrown.com/blast-a-pic/
    - title: itch.io
      url: https://jolyonbrown.itch.io/blast-a-pic
    - title: Source
      url: https://github.com/jolyonbrown/blast-a-pic

- name: point.vote
  status: shipped
  year: 2026
  summary: >-
    A planning-poker server where AI agents vote alongside humans, through REST and MCP. I used it
    to run a controlled experiment on anchoring in LLM agents: estimates moved towards a planted
    vote, but the models almost never said so.
  links:
    - title: point.vote
      url: https://point.vote/
    - title: Source, data and analysis
      url: https://github.com/jolyonbrown/point.vote
    - title: Write-up on the CV
      url: /cv/#cv-research

