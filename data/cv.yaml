profile:
  name: Jolyon Brown
  headline: Forward Deployed Engineer
  status: Open to Forward Deployed Engineering & Agentic AI roles
  tagline: Thirty years of production operations, now building agentic AI that ships.
  summary:
    - >-
      An engineer with a DevOps background and thirty years of production operations experience
      across banking, healthcare, and payment systems. A natural tinkerer, I stay close to the
      leading edge of AI tooling - constantly trying new things out, building prototypes, and
      turning experiments into things that ship.
    - >-
      My career has spanned every scale, from founding my own consultancy to national critical
      infrastructure at NHS England, HBOS, and TSYS. I've led Unix teams and designed anti-fraud
      and payment architectures, but most of it has come down to the same thing: being dropped
      into something unfamiliar and making it work.
    - >-
      Most recently I've been a consulting engineer on Fusion (Enablis's agentic AI orchestration
      platform, built on AWS Bedrock AgentCore), where I built out the platform's MCP integration
      layers, and Tech Lead of a team building the next generation of healthcare worker APIs.
    - >-
      Much of my career has been in security-critical, regulated environments: secure banking
      infrastructure, PCI-compliant payment design, and identity and access management at NHS England.
  contact:
    email: jolyon@limilo.com
    linkedin: https://www.linkedin.com/in/jolyon-brown
    github: https://github.com/jolyonbrown
    website: https://jolyonbrown.com

