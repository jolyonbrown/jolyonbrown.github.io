name: Deploy MCP server

# Deploys mcp/ to Cloudflare Workers. Needs the CLOUDFLARE_API_TOKEN repository
# secret (Cloudflare's "Edit Cloudflare Workers" token template), and optionally
# CLOUDFLARE_ACCOUNT_ID. Content changes don't need a redeploy - the worker reads
# the live site.json - so this only runs when the worker itself changes.

on:
  push:
    branches: ["master"]
    paths: ["mcp/**", ".github/workflows/mcp.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "mcp"
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: mcp

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for the Cloudflare token
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add a CLOUDFLARE_API_TOKEN repository secret (Settings > Secrets and variables > Actions)"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install Hugo CLI
        working-directory: .
        run: |
          wget -q -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Build site data for the smoke test
        working-directory: .
        run: hugo --quiet -d "${{ runner.temp }}/site"
      - name: Smoke test
        run: SITE_JSON="${{ runner.temp }}/site/site.json" node test/smoke.mjs
      - name: Install wrangler
        run: npm ci --no-audit --no-fund
      - name: Deploy
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy
